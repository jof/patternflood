; Development knob bridge: the Unexpected Maker FeatherS3 reads the Adafruit 4991
; seesaw encoders on its STEMMA QT chain and reports them over USB serial as
; JSON lines, so a host (a laptop now, the Pi later) can use the real knobs
; before the Pi's own I2C is wired. Protocol: see src/main.cpp.
;
;   pio run -t upload --upload-port /dev/ttyACMx
;
; Name the port: both the ROM loader and the running app show up as
; "Espressif USB JTAG/serial debug unit" in /dev/serial/by-id/.
;
; Board note: this is the UM FeatherS3 (16 MB flash, 8 MB PSRAM, I2C on
; GPIO8/9), NOT an Adafruit Feather ESP32-S3.
[env:feathers3]
platform = espressif32@6.13.0
board = um_feathers3
framework = arduino
monitor_speed = 115200
; Hardware USB serial-JTAG for the console (not TinyUSB OTG): it enumerates
; from the ROM onward, so uploads and the monitor work without a bootloader
; hand-off. Shows up as 303a:1001.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Core log lines would interleave with the JSON stream (seesaw's begin()
  ; logs an I2C error per board while it waits out its own reset).
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/Adafruit seesaw Library@^1.7.9
