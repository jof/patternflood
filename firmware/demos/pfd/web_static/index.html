<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241912">
<title>Patternflood</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23d9c29a'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23000'/%3E%3Ccircle cx='5' cy='5' r='1.6' fill='%23ff5a3c'/%3E%3Ccircle cx='11' cy='5' r='1.6' fill='%23ffc23c'/%3E%3Ccircle cx='5' cy='11' r='1.6' fill='%233ca8ff'/%3E%3Ccircle cx='11' cy='11' r='1.6' fill='%2364e08c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="bench">

  <section class="box" aria-label="The box">
    <div class="buttons" role="group" aria-label="The buttons on top">
      <button class="cap" data-b="0" aria-label="Previous" title="Previous (,)"><span>Previous</span></button>
      <button class="cap" data-b="1" aria-label="Menu" title="Menu (Enter)"><span>Menu</span></button>
      <button class="cap" data-b="2" aria-label="Next" title="Next (.)"><span>Next</span></button>
      <button class="cap sleep" data-b="3" aria-label="Sleep" title="Sleep (s)"><span>Sleep</span></button>
    </div>
    <div class="face">
      <div class="well" id="well">
        <canvas class="glow" id="glow" width="32" height="32" aria-hidden="true"></canvas>
        <canvas class="panel" id="panel" role="img" aria-label="The panel, live"></canvas>
        <p class="lost" id="lost" hidden>Can't reach the box. Trying again…</p>
        <button class="wake" id="wake" hidden>The box is asleep. Wake it</button>
      </div>
      <div class="lower">
        <div class="knobs" id="knobs" role="group" aria-label="The knobs"></div>
        <div class="plate">
          <canvas class="name" id="name" role="img" aria-label=""></canvas>
          <p class="where" id="where"></p>
          <p class="mode" id="mode" hidden></p>
        </div>
      </div>
    </div>
  </section>

  <section class="side" aria-label="What's on, and everything else">
    <div class="now">
      <p class="blurb" id="blurb"></p>
      <div class="controls">
        <label class="bright">
          <span>Brightness</span>
          <input type="range" id="bright" min="2" max="100" step="1" value="30">
          <output id="bright-out">30%</output>
        </label>
        <label class="audio" id="audio-row" hidden>
          <input type="checkbox" id="audio">
          <span>Music turns the knobs</span>
        </label>
        <div class="actions">
          <button id="random">Random from this list</button>
          <button id="snap">Save picture</button>
          <button id="full">Full screen</button>
        </div>
        <p class="stats" id="stats"></p>
      </div>
    </div>

    <div class="shelves">
      <div class="search">
        <input type="search" id="search" placeholder="Find a pattern by name or author" aria-label="Find a pattern">
      </div>
      <nav class="tabs" id="tabs" aria-label="Shelves"></nav>
      <p class="empty" id="empty" hidden></p>
      <ul class="grid" id="grid"></ul>
    </div>

    <p class="keys">Keys: <kbd>,</kbd> previous, <kbd>Enter</kbd> menu, <kbd>.</kbd> next, <kbd>s</kbd> sleep.
      On a knob: drag round it to turn, tap to click, hold to push; or focus it and use the arrow keys and Space.</p>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
